<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CamStem - Settings</title>
  <!-- Include Tailwind + Custom Index CSS -->
  <link rel="stylesheet" href="tailwind-output.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container" style="max-width: 480px;">
    <!-- Title -->
    <h1 class="page-title">Settings</h1>

    <!-- 2x1 Grid for buttons -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1rem;">
      <button
        class="actionButton"
        onclick="window.location.href='update.html'"
      >
        Go to Update Page
      </button>
      <button
        class="actionButton"
        onclick="window.location.href='about.html'"
      >
        About CamStem
      </button>
      <!-- Add Premiere Setup button that spans full width -->
      <button
        class="actionButton"
        onclick="window.location.href='premiere.html'"
        style="grid-column: span 2;"
      >
        Premiere Pro Extension Setup
      </button>
    </div>

    <!-- "Back to Menu" alone at the bottom -->
    <button
      class="actionButton"
      onclick="window.location.href='dashboard.html'"
      style="width: 100%;"
    >
      Back to Menu
    </button>
  </div>

  <script>
    // Settings page - no authentication needed anymore
    console.log('Settings page loaded - CamStem is now free to use!');
  </script>
</body>
</html>
